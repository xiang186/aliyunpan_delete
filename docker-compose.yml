version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aliyundrive-cleaner-backend
    ports:
      - "8000:8000"
    environment:
      - ALIYUN_CLIENT_ID=${ALIYUN_CLIENT_ID}
      - ALIYUN_CLIENT_SECRET=${ALIYUN_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - API_CALL_INTERVAL_MS=${API_CALL_INTERVAL_MS:-200}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:80"]}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aliyundrive-cleaner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
